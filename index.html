<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Colunas e Avalanches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Conceito: mesa alpina. Colunas de cartas como marcos de trilha sobre a neve; cada jogador tem cor e símbolo próprios. */
:root {
  --bg: #e7edf2;
  --surface: #f6f9fb;
  --raised: #ffffff;
  --sunk: #d8e1e8;
  --ink: #12202c;
  --muted: #4d6375;
  --line: #bccad5;
  --p0: #2f6fe4;
  --p1: #d99a00;
  --p2: #c83a86;
  --p3: #12907f;
  --danger: #d4421a;
  --warn: #a96f00;
  --good: #1c8a5a;
  --scrim: rgba(8, 16, 24, .55);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1923; --surface: #16242f; --raised: #1d2f3c; --sunk: #0a131b; --ink: #e8f0f5; --muted: #9fb3c3; --line: #2d4252;
    --p0: #6b9dff; --p1: #f0b429; --p2: #ef6fae; --p3: #3fc9b5; --danger: #ff7a4d; --warn: #f0b429; --good: #47c98f;
    --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1923; --surface: #16242f; --raised: #1d2f3c; --sunk: #0a131b; --ink: #e8f0f5; --muted: #9fb3c3; --line: #2d4252;
  --p0: #6b9dff; --p1: #f0b429; --p2: #ef6fae; --p3: #3fc9b5; --danger: #ff7a4d; --warn: #f0b429; --good: #47c98f;
  --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.app { height: 100%; max-width: 720px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; position: relative; }

/* Cabeçalho */
.top { display: flex; align-items: center; gap: 10px; padding-block: 10px 8px; }
.brand { min-width: 0; margin: 0 auto 0 0; font: 800 22px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.rd { white-space: nowrap; font: 700 12px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.tb { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--ink); background: transparent; font-weight: 700; font-size: 14px; cursor: pointer; }

/* Jogadores */
.players { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
.pchip { --pc: var(--p0); min-width: 0; padding: 6px 8px 7px; background: var(--surface); border: 1.5px solid var(--line); border-top: 4px solid var(--pc); border-radius: 10px; }
.pchip.p1 { --pc: var(--p1); } .pchip.p2 { --pc: var(--p2); } .pchip.p3 { --pc: var(--p3); }
.pchip.act { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc); }
.pn { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn .gl { color: var(--pc); font-size: 12px; }
.pp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pp b { font: 800 22px/1 var(--f-display); color: var(--ink); margin-right: 2px; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { flex: 1; height: 5px; max-width: 12px; border-radius: 2px; border: 1px solid var(--muted); }
.pips i.on { background: var(--pc); border-color: var(--pc); }

/* Tabuleiro */
.bw { flex: 1; min-height: 0; overflow-y: auto; padding-block: 12px 8px; }
.board { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px; align-items: start; }
.col { min-width: 0; }
.obj { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; width: 100%; min-height: 58px; padding: 5px 6px 4px; text-align: left; cursor: pointer; background: var(--sunk); border: 1.5px dashed var(--muted); border-radius: 8px; color: var(--ink); }
.obj.static { cursor: default; }
.obj.sel { border-style: solid; }
.on { font: 700 9.5px/1.15 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.sum { font: 800 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.sum small { font: 600 10px var(--f-body); color: var(--muted); margin-left: 1px; }
.sum.warm { color: var(--warn); } .sum.hot { color: var(--danger); }
.meter { height: 5px; margin: 4px 0 8px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--muted); }
.meter i.warm { background: var(--warn); } .meter i.hot { background: var(--danger); }

.stack { min-height: 8px; }
.card { --pc: var(--p0); position: relative; height: 72px; padding: 3px 5px 4px; display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-left: 5px solid var(--pc); border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.card.p1 { --pc: var(--p1); } .card.p2 { --pc: var(--p2); } .card.p3 { --pc: var(--p3); }
.stack .card + .card { margin-top: -44px; }
.card .row { display: flex; align-items: center; justify-content: space-between; height: 22px; gap: 2px; }
.card .num { font: 800 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.card .num .rt { font-style: normal; font-size: 12px; margin-left: 1px; color: var(--muted); }
.card .bonus { font: 700 10px/1 var(--f-body); color: var(--good); }
.card .gl { color: var(--pc); font-size: 13px; }
.card .ab { margin-top: auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 700 8.5px/1.1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.card.rot { background: repeating-linear-gradient(135deg, var(--raised) 0 6px, var(--sunk) 6px 7px); }
/* destaques da animação: anel por dentro, para aparecer mesmo na faixa coberta pela carta de baixo */
.card.out { box-shadow: 0 0 0 2px var(--danger), inset 0 0 0 3px var(--danger); background: repeating-linear-gradient(135deg, var(--raised) 0 5px, rgba(212, 66, 26, .32) 5px 10px); }
.card.hold, .card.arrive { box-shadow: 0 0 0 2px var(--good), inset 0 0 0 3px var(--good); }
.card.mark { box-shadow: 0 0 0 2px var(--warn), inset 0 0 0 3px var(--warn); }
.card.src { box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 3px var(--ink); }
.card.pop:not(.arrive) { box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 2px var(--ink); }

.slot { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 44px; margin-top: 8px; padding: 2px; border-radius: 8px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font: 700 12px/1.15 var(--f-body); }
button.slot.live { cursor: pointer; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); }
button.slot.live.risk { border-color: var(--danger); color: var(--danger); }
.slot .w { font-size: 10px; font-weight: 700; }
.info { margin: 12px 0 0; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }

/* Mensagens e mão */
.msg { margin: 0; padding: 6px 10px; max-height: 84px; overflow: auto; font-size: 12px; line-height: 1.3; color: var(--muted); background: var(--surface); border-radius: 8px; }
.msg p { margin: 0; padding-left: 8px; border-left: 3px solid var(--line); }
.msg p + p { margin-top: 3px; }
.msg p.avl { border-left-color: var(--danger); color: var(--ink); }
.msg p.hab { border-left-color: var(--warn); }
.msg.live { max-height: none; padding: 9px 12px; font-size: 15px; font-weight: 600; color: var(--ink); border: 2px solid var(--ink); }
.msg.live p { border-left-width: 5px; }
.msg.live p.mark, .msg.live p.gone, .msg.live p.avl, .msg.live p.rot, .msg.live p.m1 { border-left-color: var(--danger); }
.msg.live p.hold, .msg.live p.abil2 { border-left-color: var(--good); }
.msg.live p.abil { border-left-color: var(--warn); }
.dock { padding-block: 10px 12px; }
.hint { margin: 0 0 8px; min-height: 44px; font: 700 14px/1.25 var(--f-body); }
.hint span { display: block; margin-top: 2px; font: 500 12.5px/1.3 var(--f-body); color: var(--muted); }
.hint.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.skip { flex: none; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--ink); background: var(--raised); font-weight: 700; cursor: pointer; }
.hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.hc { --pc: var(--p0); flex: 0 0 calc((100% - 18px) / 3); min-width: 0; max-width: 140px; min-height: 80px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; background: var(--raised); border: 1.5px solid var(--line); border-top: 6px solid var(--pc); border-radius: 12px; box-shadow: 0 2px 5px rgba(0, 0, 0, .15); }
.hc.p1 { --pc: var(--p1); } .hc.p2 { --pc: var(--p2); } .hc.p3 { --pc: var(--p3); }
.hc .n { font: 800 38px/1 var(--f-display); }
.hc .hn { overflow-wrap: anywhere; font: 700 10.5px/1.15 var(--f-body); letter-spacing: .03em; text-transform: uppercase; }
.hc .ht { display: none; font: 500 11.5px/1.25 var(--f-body); color: var(--muted); }
.hc.sel { outline: 3px solid var(--ink); outline-offset: 2px; transform: translateY(-4px); }
.hand.wait .hc { opacity: .5; cursor: default; }
.prompt { padding: 10px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px; }
.prompt h2 { margin: 0 0 8px; font: 700 15px/1.25 var(--f-body); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { flex: 1 1 120px; min-height: 48px; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--ink); background: var(--raised); font-weight: 700; cursor: pointer; }
.opt.ghost { flex: 0 0 auto; border-color: var(--line); background: transparent; color: var(--muted); }

/* Folhas e modais */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet { width: 100%; max-width: 720px; max-height: 90%; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 16px 16px 0 0; }
.sheet h2 { margin: 0 0 10px; font: 800 26px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.sheet h3 { margin: 16px 0 6px; font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet p, .sheet li { font-size: 14px; }
.sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.big { display: block; width: 100%; min-height: 50px; margin-top: 8px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; font-weight: 700; font-size: 16px; cursor: pointer; }
.big.solid, .go { background: var(--ink); color: var(--bg); }
.go { display: block; width: 100%; min-height: 54px; margin-top: 18px; border: 0; border-radius: 12px; font: 800 22px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font: 700 11px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 6px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: right; font-size: 14px; }
.tbl td.tot { font: 800 22px/1 var(--f-display); }
.tbl tr.win td { background: var(--sunk); font-weight: 700; }
.tbl .gl { margin-right: 6px; }
.gl.p0 { color: var(--p0); } .gl.p1 { color: var(--p1); } .gl.p2 { color: var(--p2); } .gl.p3 { color: var(--p3); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.tipt { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; margin: 0; font-size: 14px; }
.tipt dt { font: 800 20px/1.1 var(--f-display); }
.tipt dd { margin: 0; }

/* Tela inicial */
.setup { overflow-y: auto; padding-block: 18px 28px; }
.setup h1 { margin: 0; font: 900 clamp(32px, 10.5vw, 60px)/.95 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.setup .sub { margin: 8px 0 0; color: var(--muted); }
.demo { display: flex; align-items: flex-start; justify-content: center; gap: 12px; margin: 22px 0 6px; padding: 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.dcol { width: 78px; flex: none; }
.arrow { align-self: center; text-align: center; font: 700 12px/1.25 var(--f-body); color: var(--danger); min-width: 0; flex: 0 1 90px; }
.arrow b { display: block; font: 800 26px/1 var(--f-display); }
.cap { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.fld { margin-top: 18px; }
.fld > span { display: block; margin-bottom: 6px; font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; min-height: 46px; padding: 0 6px; border: 0; border-left: 2px solid var(--ink); background: transparent; font-weight: 700; font-size: 15px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Sala online */
.setup .sect { margin: 28px 0 0; font: 800 24px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.online { margin-top: 22px; padding: 14px 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.online h2 { margin: 0 0 6px; font: 800 24px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.online .note { margin: 6px 0 0; }
.txt { display: block; width: 100%; min-height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--raised); color: var(--ink); font: 600 16px var(--f-body); }
.txt.cod { font: 800 28px/1 var(--f-display); letter-spacing: .3em; text-align: center; text-transform: uppercase; }
.txt::placeholder { color: var(--muted); opacity: .8; letter-spacing: normal; }
.big:disabled, .go:disabled { opacity: .45; cursor: default; }
.err { margin: 12px 0 0; padding: 8px 10px; border-left: 5px solid var(--danger); background: var(--sunk); border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600; }
.code { margin: 16px 0 4px; font: 900 clamp(56px, 22vw, 96px)/1 var(--f-display); letter-spacing: .16em; text-align: center; padding-left: .16em; user-select: all; -webkit-user-select: all; }
.plist { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plist li { --pc: var(--p0); display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-top: 4px solid var(--pc); border-radius: 10px; font-weight: 700; }
.plist li.p1 { --pc: var(--p1); } .plist li.p2 { --pc: var(--p2); } .plist li.p3 { --pc: var(--p3); }
.plist li > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist li em { margin-left: auto; flex: none; font: 600 12px var(--f-body); font-style: normal; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .35s ease-out; }
  .card.rotfx { animation: spin .9s ease-in-out; }
  .col.shake .stack { animation: shake .5s; }
  @keyframes pop { from { transform: translateY(-16px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes spin { from { transform: rotate(-200deg) scale(.88); } to { transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
}
@media (min-height: 760px) {
  .hc { min-height: 118px; }
  .hc .n { font-size: 42px; }
  .hc .ht { display: block; }
  .hint { min-height: 0; }
  .hint span { display: none; }
}
@media (max-height: 700px) {
  .msg:not(.live) p:nth-last-child(n+3) { display: none; }
}
@media (max-width: 380px) {
  .brand { font-size: 19px; }
  .hc .ht { font-size: 11px; }
}
</style>

</head><body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
/* Motor de regras: Colunas e Avalanches (2 a 4 jogadores, duas rodadas de pontuação) */

var LIMITE = 11; // a coluna estoura com 12 ou mais
var BONUS_TOPO = 2;

// O manual não define as cartas de objetivo. Estes são exemplos provisórios.
var OBJETIVOS = {
  neutra:  { nome: 'Sem efeito',     texto: 'Nenhuma regra extra nesta coluna.' },
  topo4:   { nome: 'Topo em dobro',  texto: 'O bônus de topo desta coluna vale 4 em vez de 2.' },
  topo0:   { nome: 'Sem topo',       texto: 'Esta coluna não dá bônus de topo.' },
  maioria: { nome: 'Maioria',        texto: 'Quem tiver mais cartas na coluna ganha +3. Em caso de empate, ninguém ganha.' },
  fundo:   { nome: 'Fundo', texto: 'Quem tiver a última carta da coluna (a de baixo) ganha +3.' },
  onze:    { nome: 'Onze exato',     texto: 'Se a coluna somar exatamente 11, quem tiver a carta do topo ganha +4.' }
};

var HABILIDADES = {
  1: { nome: 'Deslocamento', curto: 'Empurra a carta de cima para a coluna do lado.' },
  2: { nome: 'Sem habilidade', curto: 'Só soma o valor.' },
  3: { nome: 'Convocação', curto: 'Puxa a última carta de uma coluna vizinha.' },
  4: { nome: 'Sem habilidade', curto: 'Só soma o valor.' },
  5: { nome: 'Gatilho', curto: 'Na avalanche, só sai se abaixo houver 5 ou 6.' },
  6: { nome: 'Giratória', curto: 'Na avalanche, vira 3 e fica se a coluna couber.' }
};

function shuffle(arr, rnd) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function mkCard(owner, base) { return { o: owner, b: base, v: base, rot: false }; }

function newGame(n, opts) {
  opts = opts || {};
  var rnd = opts.rnd || Math.random;
  var names = opts.names || ['Você', 'Bot 2', 'Bot 3', 'Bot 4'].slice(0, n);
  var players = [];
  for (var p = 0; p < n; p++) {
    var deck = shuffle([1, 2, 3, 4, 5, 6].map(function (b) { return mkCard(p, b); }), rnd);
    players.push({ hand: deck.slice(0, 3), reserve: deck.slice(3) });
  }
  var ids = [];
  if (opts.objectives === 'neutral') {
    for (var i = 0; i < n + 1; i++) ids.push('neutra');
  } else {
    ids = shuffle(['topo4', 'topo0', 'maioria', 'fundo', 'onze', 'neutra', 'neutra'], rnd).slice(0, n + 1);
  }
  return {
    n: n, names: names, human: 0, round: 1, phase: 'play', turn: opts.first || 0, first: opts.first || 0,
    cols: ids.map(function (id) { return { obj: id, cards: [] }; }),
    players: players, discard: [], gone: [], r1: null, r2: null,
    log: [], fx: { placed: null, avl: [] }, frames: [], quiet: false
  };
}

function lg(s, k, t) { if (!s.quiet) s.log.push({ k: k, t: t }); }

function ct(s, c) {
  var val = c.rot ? '6 (girado)' : String(c.v);
  return c.o === s.human ? 'seu ' + val : val + ' do ' + s.names[c.o];
}
function whose(s, c, val) {
  return c.o === s.human ? 'seu ' + val : val + ' do ' + s.names[c.o];
}
function ctList(s, arr) {
  var t = arr.map(function (c) { return ct(s, c); });
  if (t.length <= 1) return t.join('');
  return t.slice(0, -1).join(', ') + ' e ' + t[t.length - 1];
}

function colSum(col) {
  var s = 0;
  for (var i = 0; i < col.cards.length; i++) s += col.cards[i].v;
  return s;
}

// Opções da habilidade da carta b ao ser jogada na coluna ci (calculadas antes de jogar).
function abilityPreview(s, b, ci) {
  var n = s.cols.length, cards = s.cols[ci].cards;
  if (b === 1 && cards.length >= 1) {
    return {
      kind: 'dir', moved: cards[cards.length - 1],
      options: [-1, 1].map(function (d) { return { dir: d, to: (ci + d + n) % n }; })
    };
  }
  if (b === 3) {
    var options = [];
    [ci - 1, ci + 1].forEach(function (j) {
      if (j >= 0 && j < n && s.cols[j].cards.length) {
        options.push({ from: j, card: s.cols[j].cards[s.cols[j].cards.length - 1] });
      }
    });
    if (options.length) return { kind: 'pull', options: options };
  }
  return null;
}

function actionsFor(s, bases) {
  var out = [], n = s.cols.length;
  bases.forEach(function (b) {
    for (var ci = 0; ci < n; ci++) {
      var ap = abilityPreview(s, b, ci);
      if (!ap) out.push({ b: b, col: ci, opt: null });
      else if (ap.kind === 'dir') ap.options.forEach(function (o) { out.push({ b: b, col: ci, opt: { dir: o.dir } }); });
      else ap.options.forEach(function (o) { out.push({ b: b, col: ci, opt: { from: o.from } }); });
    }
  });
  return out;
}

function idOf(c) { return { o: c.o, b: c.b }; }

function snap(s) {
  return s.cols.map(function (c) {
    return { obj: c.obj, cards: c.cards.map(function (x) { return { o: x.o, b: x.b, v: x.v, rot: x.rot }; }) };
  });
}

// Registra um quadro da animação (só no jogo real, nunca nas simulações dos bots).
function frame(s, kind, text, snd, ms, hl) {
  if (s.quiet) return;
  s.frames.push({ kind: kind, text: text, snd: snd, ms: ms, hl: hl || {}, cols: snap(s) });
}

// A carta nova sempre entra no fim (embaixo) da coluna; a mais antiga fica no topo.
function placeCard(s, card, ci, opt) {
  var ap = abilityPreview(s, card.b, ci);
  var col = s.cols[ci];
  var txt = s.names[card.o] + ' jogou ' + card.b + ' na coluna ' + (ci + 1) + '.';
  lg(s, 'play', txt);
  col.cards.push(card);
  frame(s, 'place', txt, 'place', 850, { place: [idOf(card)] });
  if (ap && ap.kind === 'dir') {
    var o = null;
    for (var i = 0; i < ap.options.length; i++) if (opt && ap.options[i].dir === opt.dir) o = ap.options[i];
    if (!o) o = ap.options[1];
    var moved = ap.moved;
    lg(s, 'hab', 'Deslocamento: o ' + ct(s, moved) + ' foi da coluna ' + (ci + 1) + ' para a coluna ' + (o.to + 1) + '.');
    frame(s, 'abil', 'Deslocamento: o ' + ct(s, moved) + ' vai da coluna ' + (ci + 1) + ' para a coluna ' + (o.to + 1) + '.', 'ability', 1200,
      { src: [idOf(card)], mark: [idOf(moved)] });
    col.cards.splice(col.cards.indexOf(moved), 1);
    s.cols[o.to].cards.push(moved);
    frame(s, 'abil2', 'O ' + ct(s, moved) + ' chegou ao fim da coluna ' + (o.to + 1) + '.', 'move', 1100, { arrive: [idOf(moved)] });
  } else if (ap && ap.kind === 'pull') {
    var o2 = null;
    for (var j = 0; j < ap.options.length; j++) if (opt && ap.options[j].from === opt.from) o2 = ap.options[j];
    if (!o2) o2 = ap.options[0];
    var pulled = o2.card;
    lg(s, 'hab', 'Convocação: o ' + ct(s, pulled) + ' veio da coluna ' + (o2.from + 1) + ' para baixo do 3.');
    frame(s, 'abil', 'Convocação: o ' + ct(s, pulled) + ' da coluna ' + (o2.from + 1) + ' vem para baixo do 3.', 'ability', 1200,
      { src: [idOf(card)], mark: [idOf(pulled)] });
    s.cols[o2.from].cards.pop();
    col.cards.push(pulled);
    frame(s, 'abil2', 'O ' + ct(s, pulled) + ' está agora embaixo do 3.', 'move', 1100, { arrive: [idOf(pulled)] });
  }
}

// Avalanche: saem as cartas mais antigas (do topo para baixo), respeitando o 5 e o 6.
function resolveColumn(s, ci) {
  var col = s.cols[ci], cards = col.cards;
  if (colSum(col) <= LIMITE) return false;
  var before = colSum(col), removed = [], notes = [];
  frame(s, 'avl', 'Avalanche na coluna ' + (ci + 1) + ': a soma chegou a ' + before + '. Saem as cartas mais antigas, a partir do topo.', 'rumble', 1600, { avl: ci });

  function drop(i) {
    var x = cards[i];
    if (x.b === 6 && !x.rot) {
      x.rot = true; x.v = 3; // carta giratória
      frame(s, 'rot', 'O ' + whose(s, x, 6) + ' gira e passa a valer 3.', 'rotate', 1400, { rot: [idOf(x)], avl: ci });
      if (colSum(col) <= LIMITE) {
        notes.push('O ' + whose(s, x, 6) + ' girou, passou a valer 3 e ficou na coluna.');
        frame(s, 'hold', 'A soma ficou em ' + colSum(col) + ': o 6 girado fica na coluna.', 'hold', 1300, { hold: [idOf(x)], avl: ci });
        return;
      }
      frame(s, 'mark', 'Ainda passa de 11: o 6 girado sai do jogo de vez.', 'crack', 1100, { out: [idOf(x)], avl: ci });
      cards.splice(i, 1); s.gone.push(x); removed.push(x);
      notes.push('O ' + whose(s, x, 6) + ' girou, mas não bastou: saiu de vez do jogo.');
      frame(s, 'gone', 'Soma da coluna: ' + colSum(col) + '.', '', 700, { avl: ci });
      return;
    }
    frame(s, 'mark', 'Sai o ' + ct(s, x) + '.', 'crack', 1100, { out: [idOf(x)], avl: ci });
    cards.splice(i, 1);
    (x.rot ? s.gone : s.discard).push(x);
    removed.push(x);
    frame(s, 'gone', 'Soma da coluna: ' + colSum(col) + '.', '', 700, { avl: ci });
  }

  var k = 0, guard = 0;
  while (colSum(col) > LIMITE && guard++ < 100) {
    if (k >= cards.length) { k = 0; drop(0); continue; } // só acontece se tudo restante for 5 protegido
    var c = cards[k], next = cards[k + 1];
    if (c.v === 5 && !(next && next.v >= 5)) {
      // Gatilho condicional: o 5 fica e saem as cartas abaixo dele
      notes.push('O ' + whose(s, c, 5) + ' ficou na coluna (abaixo dele não há 5 nem 6).');
      frame(s, 'hold', 'O ' + whose(s, c, 5) + ' fica: abaixo dele não há 5 nem 6. Saem as cartas abaixo dele.', 'hold', 1600, { hold: [idOf(c)], avl: ci });
      k++;
      continue;
    }
    drop(k);
  }
  var tail = 'A coluna ficou em ' + colSum(col) + '.';
  lg(s, 'avl', 'Avalanche na coluna ' + (ci + 1) + ' (soma ' + before + '): ' +
    (removed.length ? 'saiu ' + ctList(s, removed) + '. ' : '') + notes.join(' ') + ' ' + tail);
  frame(s, 'end', tail, '', 1000, {});
  return true;
}

function resolveAvalanches(s) {
  for (var ci = 0; ci < s.cols.length; ci++) resolveColumn(s, ci);
}

/* ---------- Pontuação ---------- */

function scoreNow(s, proj) {
  var n = s.n, cardsPts = [], top = [], obj = [], i;
  for (i = 0; i < n; i++) { cardsPts.push(0); top.push(0); obj.push(0); }
  s.cols.forEach(function (col) {
    var cs = proj ? col.cards.slice(0, -1) : col.cards;
    if (!cs.length) return;
    var sum = 0, cnt = [];
    for (i = 0; i < n; i++) cnt.push(0);
    cs.forEach(function (c) { cardsPts[c.o] += c.v; sum += c.v; cnt[c.o]++; });
    var o = col.obj, tb = BONUS_TOPO;
    if (o === 'topo4') tb = 4;
    if (o === 'topo0') tb = 0;
    top[cs[0].o] += tb;
    if (o === 'maioria') {
      var mx = Math.max.apply(null, cnt), w = [];
      for (i = 0; i < n; i++) if (cnt[i] === mx) w.push(i);
      if (w.length === 1) obj[w[0]] += 3;
    }
    if (o === 'fundo') obj[cs[cs.length - 1].o] += 3;
    if (o === 'onze' && sum === 11) obj[cs[0].o] += 4;
  });
  var total = [];
  for (i = 0; i < n; i++) total.push(cardsPts[i] + top[i] + obj[i]);
  return { cards: cardsPts, top: top, obj: obj, total: total };
}

function topBonus(objId) {
  return objId === 'topo4' ? 4 : objId === 'topo0' ? 0 : BONUS_TOPO;
}

/* ---------- Fluxo de turnos ---------- */

function unplayed(s, p) {
  var pl = s.players[p];
  return pl.hand.concat(pl.reserve);
}

function nextPlayer(s, from) {
  for (var k = 1; k <= s.n; k++) {
    var q = (from + k) % s.n;
    if (s.players[q].hand.length) return q;
  }
  return null;
}

function endRound(s) {
  var sc = scoreNow(s, false);
  if (s.round === 1) {
    s.r1 = sc; s.phase = 'score1';
    lg(s, 'info', 'Fim da primeira rodada. Primeira pontuação feita.');
  } else {
    s.r2 = sc; s.phase = 'final';
    lg(s, 'info', 'Fim da segunda rodada. Pontuação final feita.');
  }
}

function advance(s) {
  var q = nextPlayer(s, s.turn);
  if (q === null) endRound(s); else s.turn = q;
}

// Executa a jogada do jogador da vez. a = { b, col, opt }
function play(s, a) {
  var p = s.turn, pl = s.players[p];
  s.fx = { placed: null, avl: [] };
  if (!s.quiet) s.frames = [];
  var idx = -1;
  for (var i = 0; i < pl.hand.length; i++) if (pl.hand[i].b === a.b) idx = i;
  if (idx < 0) throw new Error('Carta ' + a.b + ' não está na mão de ' + s.names[p]);
  var card = pl.hand.splice(idx, 1)[0];
  placeCard(s, card, a.col, a.opt);
  if (pl.reserve.length) pl.hand.push(pl.reserve.shift());
  resolveAvalanches(s);
  advance(s);
}

function startSecondSeason(s) {
  var out = [], rec = [], p;
  if (!s.quiet) s.frames = [];
  s.cols.forEach(function (col) {
    if (col.cards.length) out.push(col.cards[col.cards.length - 1]);
  });
  if (out.length) frame(s, 'm1', 'Segunda Estação: a última carta de cada coluna sai do jogo.', 'crack', 1800, { out: out.map(idOf) });
  s.cols.forEach(function (col) {
    if (col.cards.length) s.gone.push(col.cards.pop());
  });
  lg(s, 'info', out.length
    ? 'Segunda Estação: saíram do jogo as últimas cartas de cada coluna (' + ctList(s, out) + ').'
    : 'Segunda Estação: não havia cartas para remover.');
  if (out.length) frame(s, 'm2', 'Essas cartas não voltam ao jogo.', '', 900, {});
  for (p = 0; p < s.n; p++) {
    var mine = s.discard.filter(function (c) { return c.o === p; });
    s.players[p].hand = mine;
    rec.push(s.names[p] + ' ' + mine.length);
  }
  s.discard = [];
  lg(s, 'info', 'Cartas recuperadas da pilha de descarte: ' + rec.join(', ') + '.');
  frame(s, 'm3', 'Cada jogador recupera as suas cartas da pilha de descarte.', 'ability', 1600, {});
  s.banked = s.r1.total.slice();
  s.round = 2; s.phase = 'play'; s.fx = { placed: null, avl: [] };
  var first = null;
  for (var k = 0; k < s.n; k++) {
    var q = (s.first + k) % s.n;
    if (s.players[q].hand.length) { first = q; break; }
  }
  if (first === null) endRound(s); else s.turn = first;
}

function finalResult(s) {
  var tot = [], i;
  for (i = 0; i < s.n; i++) tot.push(s.r1.total[i] + s.r2.total[i]);
  var best = Math.max.apply(null, tot), tied = [];
  for (i = 0; i < s.n; i++) if (tot[i] === best) tied.push(i);
  var usedTiebreak = false, winners = tied;
  if (tied.length > 1) {
    usedTiebreak = true;
    var low = Math.min.apply(null, tied.map(function (p) { return s.r2.total[p]; }));
    winners = tied.filter(function (p) { return s.r2.total[p] === low; });
  }
  return { totals: tot, winners: winners, tiebreak: usedTiebreak };
}

/* ---------- Bots ---------- */

function cl(s) {
  function cc(c) { return { o: c.o, b: c.b, v: c.v, rot: c.rot }; }
  return {
    n: s.n, names: s.names, human: s.human, round: s.round, turn: s.turn, quiet: true,
    cols: s.cols.map(function (c) { return { obj: c.obj, cards: c.cards.map(cc) }; }),
    players: s.players, discard: s.discard.map(cc), gone: s.gone.map(cc),
    log: [], fx: null, frames: []
  };
}

function simAct(s, p, a) {
  var c = cl(s);
  placeCard(c, mkCard(p, a.b), a.col, a.opt);
  resolveAvalanches(c);
  return c;
}

function valsAll(s) {
  var cur = scoreNow(s, false).total;
  if (s.round === 2) return cur;
  var pr = scoreNow(s, true).total;
  return cur.map(function (v, i) { return v + 0.9 * pr[i]; });
}

function margin(vals, p) {
  var o = 0, n = vals.length;
  for (var q = 0; q < n; q++) if (q !== p) o += vals[q];
  return vals[p] - o / (n - 1);
}

function handBases(s, p) { return s.players[p].hand.map(function (c) { return c.b; }); }

function botMove(s, level) {
  var p = s.turn;
  var acts = actionsFor(s, handBases(s, p));
  if (level === 'facil') return acts[Math.floor(Math.random() * acts.length)];
  var q = nextPlayer(s, p);
  var best = null, bv = -1e9;
  acts.forEach(function (a) {
    var s1 = simAct(s, p, a);
    var v1 = margin(valsAll(s1), p);
    var v = v1;
    if (level === 'dificil' && q !== null && q !== p) {
      var acts2 = actionsFor(s1, unplayed(s, q).map(function (c) { return c.b; }));
      var bq = -1e9, bs = null;
      acts2.forEach(function (a2) {
        var vals = valsAll(simAct(s1, q, a2));
        var m = margin(vals, q);
        if (m > bq) { bq = m; bs = vals; }
      });
      if (bs) v = 0.4 * v1 + 0.6 * margin(bs, p);
    }
    v += Math.random() * 0.25;
    if (v > bv) { bv = v; best = a; }
  });
  return best;
}

if (typeof module !== 'undefined') {
  module.exports = {
    newGame: newGame, play: play, botMove: botMove, actionsFor: actionsFor, abilityPreview: abilityPreview,
    startSecondSeason: startSecondSeason, finalResult: finalResult, scoreNow: scoreNow, colSum: colSum,
    resolveColumn: resolveColumn, placeCard: placeCard, mkCard: mkCard, unplayed: unplayed, shuffle: shuffle,
    OBJETIVOS: OBJETIVOS, LIMITE: LIMITE
  };
}

  /* ---------- Fluxo ---------- */

  function ms(n) { return n * SPEED[cfg.speed]; }

  // Mostra, um por um, os quadros da jogada (carta entrando, habilidade, avalanche) e depois chama done.
  function runFrames(frames, done) {
    var gen = ui.gen, i = 0;
    ui.busy = true;
    clearTimeout(ui.timer);
    function finish() {
      clearTimeout(ui.timer);
      ui.finish = null; ui.view = null;
      if (gen === ui.gen) done();
    }
    ui.finish = finish;
    function step() {
      if (gen !== ui.gen) return;
      if (i >= frames.length) { finish(); return; }
      var f = frames[i++];
      ui.view = f; render(); sfx(f.snd);
      ui.timer = setTimeout(step, ms(f.ms));
    }
    step();
  }

  function startGame() {
    saveCfg();
    clearTimeout(ui.timer);
    ui.gen++;
    var first = cfg.start === 'voce' ? 0 : Math.floor(Math.random() * cfg.n);
    G = newGame(cfg.n, { objectives: cfg.obj, first: first });
    ui.screen = 'game'; ui.sel = null; ui.pending = null; ui.info = null; ui.sheet = null; ui.view = null; ui.finish = null;
    ui.busy = G.turn !== G.human;
    G.log.push({ k: 'info', t: first === G.human ? 'Você começa.' : G.names[first] + ' começa.' });
    render();
    if (ui.busy) scheduleBot(ms(1000));
  }

  function scheduleBot(delay) {
    var gen = ui.gen;
    clearTimeout(ui.timer);
    ui.timer = setTimeout(function () { botTurn(gen); }, delay);
  }

  function botTurn(gen) {
    if (gen !== ui.gen || !G || G.phase !== 'play') return;
    if (G.turn === G.human) { ui.busy = false; render(); return; }
    play(G, botMove(G, cfg.level));
    runFrames(G.frames, after);
  }

  // Depois de uma jogada e da animação: decide quem age em seguida.
  function after() {
    if (G.phase !== 'play') { ui.busy = false; render(); sfx('chime'); return; }
    if (G.turn === G.human) { ui.busy = false; render(); return; }
    ui.busy = true;
    render();
    scheduleBot(ms(800));
  }

  function commit(a) {
    if (O.on) { sendMove({ i: O.applied, t: 'play', by: G.human, b: a.b, col: a.col, opt: a.opt || null }); return; }
    ui.sel = null; ui.pending = null;
    play(G, a);
    runFrames(G.frames, after);
  }

  function makeDb(rdb) {

    function docSnap(id, val) {

    }
    function listen(path, make, next, error) {
      var r = rdb.ref(path);
      var cb = function (s) { next(make(s)); };
      r.on('value', cb, function (e) { if (error) error(fixErr(e)); });
      return function () { r.off('value', cb); };
    }
    return {
      doc: function (path) {
        var id = path.split('/').pop();
        return {
          id: id, path: path,
          get: function () { return wrap(rdb.ref(path).once('value').then(function (s) { return docSnap(id, s.val()); })); },
          set: function (d) { return wrap(rdb.ref(path).set(d)); },
          update: function (d) { return wrap(rdb.ref(path).update(d)); },
          onSnapshot: function (next, error) { return listen(path, function (s) { return docSnap(id, s.val()); }, next, error); }
        };
      },
      collection: function (path) {
        return {
          path: path,
          get: function () { return wrap(rdb.ref(path).once('value').then(querySnap)); },
          onSnapshot: function (next, error) { return listen(path, querySnap, next, error); }
        };
      }
    };
  }

  /* ---------- Online (salas) ---------- */

  var O = { ready: false, db: null, user: null, uid: null, code: null, room: null, players: [], byIdx: {}, applied: 0,
    caught: false, movesReady: false, readyTimer: null, sending: false, netBusy: false, unsubs: [], err: '', last: null, on: false };
  try { O.last = localStorage.getItem('colunas-sala') || null; } catch (e) { /* sem armazenamento */ }

  function safeId(s) { return String(s).replace(/[^A-Za-z0-9_.~:@+-]/g, '_'); }
  function localToken() {
    var t = 'l_' + Math.random().toString(36).slice(2, 12);
    try {
      var s = localStorage.getItem('colunas-id');
      if (s) t = s; else localStorage.setItem('colunas-id', t);
    } catch (e) { /* sem armazenamento */ }
    return t;
  }
  function cleanName(s) { return String(s || '').replace(/[<>&"]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14); }
  function uniqueNames(ps) {
    var seen = {};
    return ps.map(function (p, i) {
      var base = cleanName(p.name) || ('Jogador ' + (i + 1)), n = base, k = 2;
      while (seen[n]) { n = base + ' ' + k; k++; }
      seen[n] = 1;
      return n;
    });
  }
  function errText(e) {
    var c = e && e.code;
    if (c === 'nf') return 'Sala não encontrada. Confira o código de 4 letras.';
    if (c === 'started') return 'Essa partida já começou e você não está nela.';
    if (c === 'full') return 'A sala está cheia (4 jogadores).';
    if (c === 'perm') return 'O banco de dados recusou a gravação. Confira se as regras do Firebase foram publicadas.';
    return 'Não foi possível falar com o servidor. Tente de novo.';
  }
  function newCode() {
    var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = '';
    for (var i = 0; i < 4; i++) s += A.charAt(Math.floor(Math.random() * A.length));
    return s;
  }
  function roomDoc(code) { return O.db.doc('rooms/' + code + '/info/main'); }
  function mvId(i) { return 'm' + (1000 + i); }
  function readName() {
    var el = root.querySelector('#in-name');
    var v = cleanName(el ? el.value : cfg.name) || 'Jogador';
    cfg.name = v; saveCfg();
    return v;
  }

  function initOnline() {
    try {
      var url = FIREBASE_CONFIG.databaseURL || '';
      if (typeof firebase === 'undefined' || url.indexOf('SEU-PROJETO') >= 0 || FIREBASE_CONFIG.apiKey === 'COLE-AQUI') {
        O.ready = true; return;
      }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      O.db = makeDb(firebase.database());
      O.uid = safeId(localToken());
    } catch (e) { O.db = null; }
    O.ready = true;
    if (ui.screen === 'setup') render();
  }

  function onlineHTML() {
    var h = '<section class="online"><h2>Jogar com amigos</h2>';
    if (!O.ready) return h + '<p class="note">Conectando…</p></section>';
    if (!O.db) return h + '<p class="note">O modo online ainda não foi configurado (faltam os dados do Firebase no arquivo) ou não conseguiu conectar. Enquanto isso, dá para treinar contra bots.</p></section>';
    var dis = O.netBusy ? ' disabled' : '';
    h += '<p class="note">Crie uma sala e passe o código aos amigos, ou entre numa sala com o código que recebeu. Cada amigo abre este mesmo link no próprio celular. A opção Cartas de objetivo, mais abaixo, vale para a sala que você criar.</p>' +
      '<div class="fld"><span>Seu nome</span><input class="txt" id="in-name" data-key="in-name" maxlength="14" autocomplete="off" placeholder="Como aparece para os outros" value="' + esc(cfg.name || '') + '"></div>' +
      '<button type="button" class="big solid" data-act="create" data-key="create"' + dis + '>Criar sala</button>' +
      '<div class="fld"><span>Código da sala</span><input class="txt cod" id="in-code" data-key="in-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" value="' + esc(ui.joinCode || '') + '"></div>' +
      '<button type="button" class="big" data-act="join" data-key="join"' + dis + '>Entrar na sala</button>';
    if (O.last) h += '<button type="button" class="big" data-act="rejoin" data-key="rejoin"' + dis + '>Voltar à sala ' + esc(O.last) + '</button>';
    if (O.err) h += '<p class="err" role="alert">' + esc(O.err) + '</p>';
    return h + '</section>';
  }

  function lobbyHTML() {
    var r = O.room, host = !!r && r.host === O.uid, ps = O.players.slice(0, 4);
    var items = ps.map(function (p, i) {
      var tag = (r && p.id === r.host ? 'anfitrião' : '') + (p.id === O.uid ? (r && p.id === r.host ? ' · você' : 'você') : '');
      return '<li class="p' + i + '"><span class="gl p' + i + '" aria-hidden="true">' + GLYPH[i] + '</span><span>' + esc(cleanName(p.name) || 'Jogador') + '</span><em>' + tag + '</em></li>';
    }).join('');
    var can = host && ps.length >= 2 && !O.netBusy;
    return '<div class="app setup lobby"><h1>Sala</h1>' +
      '<div class="code" aria-label="Código da sala">' + esc(O.code) + '</div>' +
      '<p class="sub" style="text-align:center">Passe este código aos amigos. Eles abrem o mesmo link, tocam em Entrar na sala e digitam o código.</p>' +
      '<ul class="plist" aria-live="polite">' + (items || '<li><span>Conectando…</span></li>') + '</ul>' +
      '<p class="note">' + ps.length + ' de 4 jogadores. A partida precisa de pelo menos 2.</p>' +
      (host
        ? '<button type="button" class="go" data-act="startRoom" data-key="startRoom"' + (can ? '' : ' disabled') + '>Começar partida</button>'
        : '<p class="note"><b>Aguardando o anfitrião começar a partida…</b></p>') +
      (O.err ? '<p class="err" role="alert">' + esc(O.err) + '</p>' : '') +
      '<button type="button" class="big" data-act="leave" data-key="leave">Sair da sala</button></div>';
  }

  function fail(msg) { O.netBusy = false; O.err = msg; render(); }

  function addPlayer(code, name) {
    return O.db.doc('rooms/' + code + '/players/' + O.uid).set({ id: O.uid, name: name, joinedAt: Date.now() });
  }

  function createRoom() {
    if (!O.db || O.netBusy) return;
    var name = readName();
    O.netBusy = true; O.err = ''; render();
    function attempt(n) {
      var code = newCode();
      roomDoc(code).get().then(function (snap) {
        if (snap.exists && n < 6) { attempt(n + 1); return null; }
        return roomDoc(code).set({ code: code, host: O.uid, status: 'lobby', obj: cfg.obj, createdAt: Date.now(), n: 0, order: [], init: '' })
          .then(function () { return addPlayer(code, name); })
          .then(function () { enterRoom(code); });
      }).catch(function (e) { fail(errText(e)); });
    }
    attempt(0);
  }

  function joinRoom(code, name) {
    if (!O.db || O.netBusy) return;
    code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (code.length !== 4) { fail('Digite o código de 4 letras da sala.'); return; }
    O.netBusy = true; O.err = ''; render();
    roomDoc(code).get().then(function (snap) {
      if (!snap.exists) throw { code: 'nf' };
      var r = snap.data();
      return O.db.collection('rooms/' + code + '/players').get().then(function (ps) {
        var ids = ps.docs.map(function (d) { return d.id; });
        if (r.status === 'playing') {
          if ((r.order || []).indexOf(O.uid) < 0) throw { code: 'started' };
          return null;
        }
        if (ids.indexOf(O.uid) >= 0) return null;
        if (ids.length >= 4) throw { code: 'full' };
        return addPlayer(code, name);
      }).then(function () { enterRoom(code); });
    }).catch(function (e) { fail(errText(e)); });
  }

  function leaveSubs() {
    O.unsubs.forEach(function (u) { try { u(); } catch (e) { /* ignora */ } });
    O.unsubs = [];
    clearTimeout(O.readyTimer); O.readyTimer = null;
  }

  function leaveRoom(msg) {
    leaveSubs();
    O.on = false; O.room = null; O.players = []; O.byIdx = {}; O.applied = 0; O.caught = false; O.movesReady = false; O.sending = false; O.netBusy = false;
    clearTimeout(ui.timer); ui.gen++;
    G = null; ui.screen = 'setup'; ui.sheet = null; ui.view = null; ui.busy = false; ui.sel = null; ui.pending = null; ui.finish = null;
    O.err = msg || '';
    render();
  }

  function onSubErr() {
    if (!O.on) return;
    O.err = 'A conexão com a sala caiu. Volte ao início e entre de novo com o código.';
    render();
  }

  function enterRoom(code) {
    leaveSubs();
    O.code = code; O.on = true; O.netBusy = false; O.err = '';
    O.room = null; O.players = []; O.byIdx = {}; O.applied = 0; O.caught = false; O.movesReady = false; O.sending = false;
    try { localStorage.setItem('colunas-sala', code); } catch (e) { /* sem armazenamento */ }
    O.last = code;
    G = null; clearTimeout(ui.timer); ui.gen++;
    ui.screen = 'lobby'; ui.sheet = null; ui.view = null; ui.busy = false; ui.sel = null; ui.pending = null; ui.finish = null;
    render();
    var base = 'rooms/' + code;
    O.unsubs.push(roomDoc(code).onSnapshot(function (s) {
      if (!O.on || O.code !== code) return;
      if (!s.exists) { leaveRoom('Essa sala não existe mais.'); return; }
      O.room = s.data();
      if (O.room.status === 'playing' && !G) startOnline();
      else if (ui.screen === 'lobby') render();
    }, onSubErr));
    O.unsubs.push(O.db.collection(base + '/players').onSnapshot(function (q) {
      if (!O.on || O.code !== code) return;
      O.players = q.docs.map(function (d) { return d.data(); }).sort(function (a, b) {
        return (a.joinedAt - b.joinedAt) || (a.id < b.id ? -1 : 1);
      });
      if (ui.screen === 'lobby') render();
    }, onSubErr));
    O.unsubs.push(O.db.collection(base + '/moves').onSnapshot(function (q) {
      if (!O.on || O.code !== code) return;
      var m = {};
      q.docs.forEach(function (d) { var x = d.data(); m[x.i] = x; });
      O.byIdx = m;
      if (!q.metadata || !q.metadata.fromCache) O.movesReady = true;
      else if (!O.readyTimer) O.readyTimer = setTimeout(function () { O.movesReady = true; if (G) pump(); }, 2500);
      if (G) pump();
    }, onSubErr));
  }

  function startRoom() {
    var r = O.room;
    if (!r || r.host !== O.uid || r.status !== 'lobby' || O.netBusy) return;
    var ps = O.players.slice(0, 4);
    if (ps.length < 2) return;
    var first = Math.floor(Math.random() * ps.length);
    var s = newGame(ps.length, { names: uniqueNames(ps), objectives: r.obj, first: first });
    O.netBusy = true; O.err = ''; render();
    roomDoc(O.code).update({
      status: 'playing', n: ps.length, init: JSON.stringify(s),
      order: ps.map(function (p) { return p.id; })
    }).then(function () { O.netBusy = false; }).catch(function (e) { fail(errText(e)); });
  }

  // Todos os aparelhos partem do mesmo estado inicial e aplicam as mesmas jogadas na mesma ordem.
  function startOnline() {
    var r = O.room, me = (r.order || []).indexOf(O.uid), s;
    if (me < 0) { leaveRoom('Essa partida já começou e você não está nela.'); return; }
    try { s = JSON.parse(r.init); } catch (e) { leaveRoom('Não foi possível abrir a partida.'); return; }
    s.human = me; s.quiet = false; s.frames = []; if (!s.log) s.log = [];
    s.log.push({ k: 'info', t: s.first === me ? 'Você começa.' : s.names[s.first] + ' começa.' });
    G = s;
    ui.screen = 'game'; ui.sel = null; ui.pending = null; ui.info = null; ui.sheet = null; ui.view = null; ui.finish = null; ui.busy = false;
    O.applied = 0; O.caught = false; O.sending = false; O.err = '';
    render();
    pump();
  }

  function applyMove(m) {
    O.applied++;
    try {
      if (m.t === 'play') {
        if (G.phase !== 'play' || G.turn !== m.by) return false;
        play(G, { b: m.b, col: m.col, opt: m.opt || null });
        return true;
      }
      if (m.t === 'season2') {
        if (G.phase !== 'score1') return false;
        startSecondSeason(G);
        return true;
      }
    } catch (e) { /* jogada inválida: ignora */ }
    return false;
  }

  function afterOnline() {
    ui.busy = false; render();
    if (G && G.phase === 'final') sfx('chime');
    pump();
  }

  function pump() {
    if (!O.on || !G || ui.busy || !O.movesReady) return;
    var m;
    if (!O.caught) {
      while ((m = O.byIdx[O.applied])) applyMove(m);
      O.caught = true; O.sending = false;
      ui.sel = null; ui.pending = null; render();
      return;
    }
    m = O.byIdx[O.applied];
    if (!m) return;
    var ok = applyMove(m);
    O.sending = false; ui.sel = null; ui.pending = null;
    if (ok && G.frames && G.frames.length) runFrames(G.frames, afterOnline);
    else { render(); pump(); }
  }

  function sendMove(m) {
    if (O.sending) return;
    O.sending = true; O.err = ''; ui.sel = null; ui.pending = null; render();
    O.db.doc('rooms/' + O.code + '/moves/' + mvId(m.i)).set(m).catch(function (e) {
      O.sending = false; O.err = errText(e); render();
    });
  }

  /* ---------- Eventos ---------- */

  root.addEventListener('click', function (e) {
    if (cfg.sound === 'on') ac();
    var t = e.target.closest('[data-act]');
    if (!t || !root.contains(t)) return;
    var act = t.getAttribute('data-act');
    if (act === 'bg' && e.target !== t) return;

    if (act === 'create') { createRoom(); return; }
    if (act === 'join') { var ci0 = root.querySelector('#in-code'); joinRoom(ci0 ? ci0.value : '', readName()); return; }
    if (act === 'rejoin') { joinRoom(O.last, readName()); return; }
    if (act === 'startRoom') { startRoom(); return; }
    if (act === 'leave') { leaveRoom(''); return; }

    if (act === 'cfg') {
      var k = t.getAttribute('data-k'), v = t.getAttribute('data-v');
      cfg[k] = (k === 'n') ? +v : v;
      saveCfg();
      if (k === 'sound' && v === 'on') sfx('tick');
      render();
    } else if (act === 'start' || act === 'again') {
      startGame();
    } else if (act === 'toSetup') {
      if (O.on) { leaveRoom(''); return; }
      clearTimeout(ui.timer); ui.gen++; ui.screen = 'setup'; ui.sheet = null; ui.view = null; ui.busy = false; render();
    } else if (act === 'sheet') {
      ui.sheet = t.getAttribute('data-s'); render();
    } else if (act === 'closeSheet' || act === 'bg') {
      ui.sheet = null; render();
    } else if (act === 'skip') {
      if (ui.finish) ui.finish();
    } else if (act === 'info') {
      var ci = +t.getAttribute('data-ci');
      ui.info = ui.info === ci ? null : ci; render();
    } else if (act === 'pick') {
      if (!myTurn() || ui.pending) return;
      O.err = '';
      var b = +t.getAttribute('data-b');
      ui.sel = ui.sel === b ? null : b; sfx('tick'); render();
    } else if (act === 'slot') {
      if (!myTurn() || ui.sel == null) return;
      var col = +t.getAttribute('data-ci'), ap = abilityPreview(G, ui.sel, col);
      if (!ap) { commit({ b: ui.sel, col: col, opt: null }); return; }
      if (ap.kind === 'pull' && ap.options.length === 1) { commit({ b: ui.sel, col: col, opt: { from: ap.options[0].from } }); return; }
      ui.pending = { b: ui.sel, col: col, ap: ap }; render();
    } else if (act === 'opt') {
      var p = ui.pending; if (!p) return;
      var o = p.ap.options[+t.getAttribute('data-i')];
      commit({ b: p.b, col: p.col, opt: p.ap.kind === 'dir' ? { dir: o.dir } : { from: o.from } });
    } else if (act === 'cancel') {
      ui.pending = null; render();
    } else if (act === 'season2') {
      if (O.on) { if (G.phase === 'score1') sendMove({ i: O.applied, t: 'season2', by: G.human }); return; }
      startSecondSeason(G);
      ui.sel = null; ui.pending = null;
      runFrames(G.frames, function () {
        ui.busy = G.phase === 'play' && G.turn !== G.human;
        render();
        if (ui.busy) scheduleBot(ms(900));
      });
    }
  });
  root.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'in-name') { cfg.name = t.value.slice(0, 14); saveCfg(); }
    else if (t.id === 'in-code') {
      t.value = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
      ui.joinCode = t.value;
    }
  });
  initOnline();
  render();
})();
</script>
</body></html>
